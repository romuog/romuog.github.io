<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="rgAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo Hexagonal / Escudo de Engenharia -->
  <path d="M32 3 L58 17 V47 L32 61 L6 47 V17 Z" fill="#0B1325" stroke="url(#rgAccent)" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Detalhe Interno de Circuito / Rede -->
  <path d="M32 10 L48 20 V44 L32 54 L16 44 V20 Z" fill="url(#shieldBg)" fill-opacity="0.5" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3"/>
  
  <!-- Monograma Elegante RG -->
  <!-- R -->
  <path d="M21 21 H31 C34.5 21 37 23.5 37 27 C37 30.5 34.5 33 31 33 H26 V43 H21 V21 Z M26 26 V28 H30.5 C31.8 28 32.5 27.5 32.5 27 C32.5 26.5 31.8 26 30.5 26 H26 Z" fill="#FFFFFF"/>
  <path d="M31 32 L38 43 H32.5 L27 33.5 Z" fill="url(#rgAccent)"/>
  
  <!-- Ponto de Conexão / Status Ativo -->
  <circle cx="45" cy="19" r="3.5" fill="#10B981" filter="url(#iconGlow)"/>
</svg>
