<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <radialGradient id="ogBg" cx="70%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0B1325"/>
      <stop offset="100%" stop-color="#050B14"/>
    </radialGradient>
    <linearGradient id="ogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>
  
  <!-- Linhas de Grid Tecnológico -->
  <g stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Tag de Status -->
  <g transform="translate(100, 110)">
    <rect width="300" height="38" rx="19" fill="#0284C7" fill-opacity="0.15" stroke="#0284C7" stroke-opacity="0.4"/>
    <circle cx="20" cy="19" r="5" fill="#10B981"/>
    <text x="36" y="24" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#38BDF8" letter-spacing="1">ENGENHARIA WEB &amp; INFRAESTRUTURA</text>
  </g>

  <!-- Nome Principal em Title Case -->
  <text x="100" y="235" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="64" font-weight="800" fill="#F8FAFC" letter-spacing="-1">Romulo Galvao</text>
  
  <!-- Subtítulo / Especialidades -->
  <text x="100" y="295" font-family="'Inter', sans-serif" font-size="24" font-weight="500" fill="#94A3B8">
    Desenvolvimento Web (PHP / Laravel) • Infraestrutura Linux • MikroTik • Cyber Security
  </text>

  <!-- Descrição Curta de Valor -->
  <text x="100" y="380" font-family="'Inter', sans-serif" font-size="20" font-weight="400" fill="#CBD5E1">
    Sistemas Web Robustos, Servidores de Alta Disponibilidade e Segurança da Informação.
  </text>

  <!-- Badges de Autoridade -->
  <g transform="translate(100, 460)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="220" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="20" y="32" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#F1F5F9">🎓 Especialista Cyber Security</text>
    
    <!-- Badge 2 -->
    <rect x="235" y="0" width="220" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="255" y="32" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#F1F5F9">🏛️ Ex-Docente IFRN</text>

    <!-- Badge 3 -->
    <rect x="470" y="0" width="230" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="490" y="32" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#F1F5F9">💻 Tecnólogo Sist. Internet</text>
  </g>

  <!-- Localização -->
  <text x="100" y="565" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#64748B">
    📍 Currais Novos / RN — Atendimento Consultivo Nacional
  </text>
</svg>
